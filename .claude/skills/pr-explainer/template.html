<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: one 880px column read top to bottom in review order: the gist, where the
   change is, how it fits, where it could break, a game to check understanding, then
   intent, tests and the questions to answer before approving. Long lists fold away. */
:root {
  --paper: #f5f6f8;
  --panel: #ffffff;
  --ink: #171a21;
  --muted: #596170;
  --rule: #dce0e6;
  --accent: #3249a8;
  --accent-soft: #e8ecfb;
  --add: #1a7f37;
  --del: #c4232c;
  --risk-high: #c22a2a;
  --risk-med: #9a5b00;
  --risk-low: #2b7a3b;
  --changed: #f08c00; /* same literal as the Mermaid classDef in prx.py */
  --removed: #e03131;
  --play: #6b3fd0;
  --play-soft: #f1ebff;
  --good: #1a7f37;
  --bad: #c4232c;
  --code-bg: #eef1f5;
  --tok-kw: #7a3fd0;
  --tok-str: #0f6b5c;
  --tok-com: #6b7280;
  --tok-num: #a3480a;
  --tok-fn: #2a4fb8;
  --tok-attr: #8a3a73;
  --shadow: 0 1px 2px rgb(16 24 40 / .05), 0 4px 14px rgb(16 24 40 / .05);
  --font-display: "Archivo", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #101318; --panel: #171b22; --ink: #e5e8ee; --muted: #9aa3b2; --rule: #29303b;
    --accent: #93a8ff; --accent-soft: #1d2540; --add: #46c35e; --del: #ff7b72;
    --risk-high: #ff7070; --risk-med: #e8b44a; --risk-low: #5fd27a;
    --play: #b79bff; --play-soft: #251d3d; --good: #5fd27a; --bad: #ff7b72;
    --code-bg: #0c0f13; --tok-kw: #c4a2ff; --tok-str: #6fd6bf; --tok-com: #8b94a3;
    --tok-num: #f2a66b; --tok-fn: #93b4ff; --tok-attr: #f0a0d8;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #101318; --panel: #171b22; --ink: #e5e8ee; --muted: #9aa3b2; --rule: #29303b;
  --accent: #93a8ff; --accent-soft: #1d2540; --add: #46c35e; --del: #ff7b72;
  --risk-high: #ff7070; --risk-med: #e8b44a; --risk-low: #5fd27a;
  --play: #b79bff; --play-soft: #251d3d; --good: #5fd27a; --bad: #ff7b72;
  --code-bg: #0c0f13; --tok-kw: #c4a2ff; --tok-str: #6fd6bf; --tok-com: #8b94a3;
  --tok-num: #f2a66b; --tok-fn: #93b4ff; --tok-attr: #f0a0d8;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: 64px; }
body { background: var(--paper); color: var(--ink); font: 400 16px/1.55 var(--font-body); margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; color: inherit; }

.page { max-width: 880px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 32px); padding-block: 32px 56px; display: grid; gap: 48px; }
.page > * { min-width: 0; }

/* Masthead */
.mast { display: grid; gap: 14px; }
.eyebrow { margin: 0; font: 600 12px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-family: var(--font-display); font-stretch: 115%; font-weight: 760; font-size: clamp(1.65rem, 1.1rem + 2.4vw, 2.5rem); line-height: 1.08; letter-spacing: -.01em; text-wrap: balance; }
.nw { white-space: nowrap; } /* command flags in the title: don't break after the hyphen */
.facts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 500 13px/1 var(--font-mono); border: 1px solid var(--rule); background: var(--panel); border-radius: 999px; padding: 6px 10px; color: var(--ink); text-decoration: none; }
.chip .k, .branch { color: var(--muted); }
.branch { overflow-wrap: anywhere; }
.diffstat { font-variant-numeric: tabular-nums; }
.add { color: var(--add); font-weight: 600; }
.del { color: var(--del); font-weight: 600; }
.diffstat .n { color: var(--muted); }
.blocks { display: inline-flex; gap: 2px; }
.blocks i { width: 8px; height: 8px; border-radius: 2px; background: var(--rule); }
.blocks .b-add { background: var(--add); }
.blocks .b-del { background: var(--del); }
.provenance { margin: 0; max-width: 64ch; color: var(--muted); font-size: 14px; }
.updated { margin: 0; max-width: 64ch; padding: 8px 12px; border-radius: 8px; background: var(--accent-soft); font-size: 14px; }
.before { font: 500 11px/1.4 var(--font-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 99px; }

.risk { display: inline-block; font: 600 12px/1 var(--font-body); letter-spacing: .02em; padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
.risk-high { color: var(--risk-high); background: color-mix(in srgb, var(--risk-high) 13%, transparent); }
.risk-medium { color: var(--risk-med); background: color-mix(in srgb, var(--risk-med) 15%, transparent); }
.risk-low { color: var(--risk-low); background: color-mix(in srgb, var(--risk-low) 14%, transparent); }

/* Section nav: sticky, with the reviewer's progress through hotspots, scenarios and questions */
.jump { position: sticky; top: 0; z-index: 20; margin-block: -24px; display: flex; align-items: center; gap: 12px; padding: 10px 0; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
.jump-links { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; }
.jump-links::-webkit-scrollbar { display: none; }
.jump-links a { flex: none; font: 600 13px/1 var(--font-body); color: var(--muted); text-decoration: none; padding: 7px 10px; border-radius: 999px; }
.jump-links a:hover { color: var(--ink); background: var(--panel); }
.jump-links a.on { color: var(--paper); background: var(--ink); }
.progress { flex: none; display: flex; align-items: center; gap: 8px; font: 500 12px/1 var(--font-mono); color: var(--muted); }
.pbar { width: 72px; height: 6px; border-radius: 99px; background: var(--rule); overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; background: var(--good); border-radius: 99px; transition: width .4s ease; }
.progress.done { color: var(--good); }
@media (max-width: 560px) { .pbar { width: 40px; } }

/* Sections */
section { display: grid; gap: 14px; scroll-margin-top: 64px; }
.section-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
h2 { margin: 0; font-family: var(--font-display); font-stretch: 100%; font-weight: 720; font-size: 1.3rem; letter-spacing: -.005em; }
h3 { margin: 0 0 10px; font-family: var(--font-display); font-weight: 650; font-size: 1rem; }
h4 { margin: 16px 0 6px; font: 600 11px/1.2 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.lede { margin: -6px 0 0; color: var(--muted); max-width: 66ch; }
.none { margin: 0; color: var(--muted); font-style: italic; }
ul, ol { margin: 0; padding-left: 1.2em; }
li + li { margin-top: 5px; }

/* In 20 seconds */
.tldr { list-style: none; padding: 0; display: grid; gap: 10px; counter-reset: t; }
.tldr li { counter-increment: t; position: relative; margin: 0; padding: 14px 16px 14px 56px; background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; font-size: 1.06rem; line-height: 1.5; box-shadow: var(--shadow); }
.tldr li::before { content: counter(t); position: absolute; left: 16px; top: 13px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 700 14px/1 var(--font-display); color: var(--accent); background: var(--accent-soft); }

/* Change map: each changed file as a bar sized by churn */
.cmap { list-style: none; padding: 0; margin: 0; background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 6px 0; box-shadow: var(--shadow); }
.crow { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(60px, 1fr) auto 3.4em; align-items: center; gap: 12px; margin: 0; padding: 6px 14px; font: 13px/1.3 var(--font-mono); }
.crow + .crow { border-top: 1px solid color-mix(in srgb, var(--rule) 60%, transparent); }
.crow.hot { background: color-mix(in srgb, var(--changed) 6%, transparent); }
.cpath, .cpath a { display: flex; min-width: 0; white-space: nowrap; }
.cpath a { color: inherit; text-decoration: none; }
.cpath a:hover b { text-decoration: underline; }
.cpath > a:not(.before) { overflow: hidden; } /* a long name and its "test" label clip before the tag after them */
.cpath .dir { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.cpath b { flex: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; font-weight: 600; } /* cut only once the folder is gone */
.cbar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: color-mix(in srgb, var(--rule) 50%, transparent); }
.cbar i { display: block; height: 100%; }
.cbar .a { background: var(--add); }
.cbar .d { background: var(--del); }
.cbar.over { -webkit-mask-image: linear-gradient(90deg, #000 80%, transparent); mask-image: linear-gradient(90deg, #000 80%, transparent); } /* off the scale */
.crow.test .cbar i { opacity: .4; } /* a test file: the eye goes to the code first */
.crow.test .cpath b { font-weight: 500; }
.cnum { white-space: nowrap; font-variant-numeric: tabular-nums; font-size: 12px; }
.cmarks { display: flex; gap: 4px; justify-content: flex-end; }
.hb { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font: 700 11px/1 var(--font-display); color: var(--paper); text-decoration: none; }
.hb-high { background: var(--risk-high); }
.hb-medium { background: var(--risk-med); }
.cmore { margin: 0; color: var(--muted); font-size: 14px; }
@media (max-width: 560px) {
  .crow { grid-template-columns: minmax(0, 1fr) auto 2.6em; } .cbar { display: none; }
  .crow.since .cpath { flex-wrap: wrap; gap: 3px 8px; } /* the tag goes under the name rather than cut it */
  .crow.since .cpath .before { margin-left: 0; }
}

/* Diagram, with a guided tour and a full-size view */
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.seg { display: inline-flex; padding: 3px; border: 1px solid var(--rule); border-radius: 999px; background: var(--panel); }
.seg button { font: 600 13px/1 var(--font-body); color: var(--muted); background: none; border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.seg button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.tool { font: 600 13px/1 var(--font-body); border: 1px solid var(--rule); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.tool:hover { border-color: var(--accent); }
.tool.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.tool .n { opacity: .75; font-weight: 500; margin-left: 2px; }
.tool:disabled { opacity: .5; cursor: progress; }
/* A diagram wider than the stage scrolls sideways, and macOS hides the scrollbar until it's used: a
   shade at each edge with more beyond it says so. The shades stay at the edges; the covers move with
   the diagram and hide each one once its end is reached. */
.stage {
  position: relative; display: grid; border: 1px solid var(--rule); border-radius: 12px; padding: 16px;
  overflow-x: auto; box-shadow: var(--shadow);
  --shade: color-mix(in srgb, var(--ink) 22%, transparent);
  background:
    linear-gradient(to right, var(--panel) 40%, transparent) left / 40px 100% no-repeat local,
    linear-gradient(to left, var(--panel) 40%, transparent) right / 40px 100% no-repeat local,
    linear-gradient(to right, var(--shade), transparent) left / 18px 100% no-repeat scroll,
    linear-gradient(to left, var(--shade), transparent) right / 18px 100% no-repeat scroll,
    var(--panel);
}
.panel { grid-area: 1 / 1; margin: 0; min-width: 0; }
.panel:not(.is-active) { visibility: hidden; overflow: hidden; } /* still laid out, but a wider hidden diagram doesn't widen the scroll (or shade the edge) */
pre.mermaid { margin: 0; background: none; text-align: center; font: 12px/1.4 var(--font-mono); color: var(--muted); white-space: pre; }
pre.mermaid.mm-failed { text-align: left; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; } /* a diagram Mermaid couldn't read, as source */
pre.mermaid svg { max-width: 100%; height: auto; }
@media (max-width: 600px) { pre.mermaid svg { min-width: 520px; } } /* scroll the stage rather than shrink labels to 6px */
.stage.full { position: fixed; inset: 12px; z-index: 60; overflow: auto; padding: 48px 24px 24px; box-shadow: 0 0 0 100vmax rgb(0 0 0 / .45), 0 20px 60px rgb(0 0 0 / .35); }
.stage.full .panel { justify-self: safe center; } /* centred while it fits; wider, from the left edge so all of it scrolls into view */
.stage.full .panel:not(.is-active) { max-width: 100%; } /* at its own width, the hidden one would still set the scroll */
.stage.full pre.mermaid svg { max-width: none !important; min-width: 0; }
.close-full { position: sticky; top: 0; left: 100%; grid-area: 1 / 1; align-self: start; justify-self: end; z-index: 2; margin: -36px -8px 0 0; }
.close-full, .btn { font: 600 13px/1 var(--font-body); border: 1px solid var(--accent); background: var(--accent); color: var(--paper); border-radius: 999px; padding: 9px 16px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
.prx-link { cursor: pointer; }
.prx-link:hover, .prx-link:focus-visible { opacity: .8; }
.stage.touring g.node, .stage.touring .edgePaths, .stage.touring .edgeLabels { opacity: .18; transition: opacity .35s ease; }
.stage.touring g.node.on { opacity: 1; filter: drop-shadow(0 0 7px var(--accent)); }
.tour { position: sticky; bottom: 12px; z-index: 15; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border: 1.5px solid var(--accent); border-radius: 12px; background: var(--accent-soft); box-shadow: var(--shadow); } /* stays in view below a tall diagram */
.stage.full ~ .tour { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(820px, calc(100% - 48px)); z-index: 70; } /* above the full-size diagram */
.tour-text { display: grid; gap: 4px; flex: 1 1 320px; }
.tour-count { font: 600 11px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.tour p { margin: 0; font-size: 1.04rem; }
.tour-nav { display: flex; gap: 8px; }
.legend { margin: 0; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 16px; height: 11px; border-radius: 3px; }
.sw-changed { border: 3px solid var(--changed); }
.sw-removed { border: 2px dashed var(--removed); }

/* Hotspots: ranked, so the rank numeral leads each card; the headline says what could break */
.hotspot { display: grid; gap: 12px; background: var(--panel); border: 1px solid var(--rule); border-left: 4px solid var(--risk-med); border-radius: 12px; padding: 16px 18px; min-width: 0; box-shadow: var(--shadow); scroll-margin-top: 72px; }
.hotspot.hs-high { border-left-color: var(--risk-high); }
.hotspot + .hotspot { margin-top: 14px; }
.hotspot.seen { opacity: .72; }
.hs-head { display: flex; gap: 14px; align-items: flex-start; }
.rank { flex: none; font-family: var(--font-display); font-stretch: 125%; font-weight: 800; font-size: 2rem; line-height: .9; color: var(--muted); font-variant-numeric: tabular-nums; }
.hs-title { display: grid; gap: 8px; min-width: 0; }
.headline { margin: 0; font-size: 1.18rem; line-height: 1.3; text-wrap: balance; }
.hs-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.path { font: 500 13px/1.35 var(--font-mono); overflow-wrap: anywhere; }
a.path { text-decoration: none; }
a.path:hover { text-decoration: underline; }
.lines { color: var(--muted); font-weight: 400; }
.cat { font: 500 12px/1 var(--font-mono); color: var(--muted); border: 1px solid var(--rule); border-radius: 999px; padding: 5px 9px; }
.why { margin: 0; max-width: 70ch; }
pre.code { position: relative; margin: 0; overflow-x: auto; background: var(--code-bg); color: var(--ink); border-radius: 8px; padding: 12px 14px; font: 13px/1.6 var(--font-mono); tab-size: 4; }
pre.code code { position: relative; z-index: 1; font: inherit; background: none; }
pre.code .band { position: absolute; left: 0; z-index: 0; background: color-mix(in srgb, var(--changed) 17%, transparent); box-shadow: inset 3px 0 0 var(--changed); pointer-events: none; }
.check { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 15px; color: var(--muted); }
.check input { appearance: none; flex: none; width: 20px; height: 20px; margin: 0; border: 2px solid var(--rule); border-radius: 6px; background: var(--panel); display: grid; place-items: center; cursor: pointer; transition: background .15s, border-color .15s; }
.check input::after { content: ""; width: 6px; height: 11px; border: solid var(--paper); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); opacity: 0; }
.check input:checked { background: var(--good); border-color: var(--good); }
.check input:checked::after { opacity: 1; }
.check input:checked + span { color: var(--ink); }

/* Syntax colours for highlight.js, from the theme tokens */
.hljs-keyword, .hljs-selector-tag, .hljs-built_in, .hljs-type, .hljs-doctag { color: var(--tok-kw); }
.hljs-string, .hljs-regexp, .hljs-symbol, .hljs-template-variable { color: var(--tok-str); }
.hljs-comment, .hljs-quote { color: var(--tok-com); font-style: italic; }
.hljs-number, .hljs-literal { color: var(--tok-num); }
.hljs-title, .hljs-section, .hljs-function .hljs-title { color: var(--tok-fn); }
.hljs-attr, .hljs-attribute, .hljs-variable, .hljs-params, .hljs-meta, .hljs-property { color: var(--tok-attr); }
.hljs-addition { color: var(--add); background: color-mix(in srgb, var(--add) 12%, transparent); display: inline-block; width: 100%; }
.hljs-deletion { color: var(--del); background: color-mix(in srgb, var(--del) 12%, transparent); display: inline-block; width: 100%; }
.hljs-emphasis { font-style: italic; }
.hljs-strong { font-weight: 600; }

/* Predict it: one scenario at a time; pick an answer, see why */
.game { display: grid; gap: 14px; background: var(--panel); border: 1.5px solid color-mix(in srgb, var(--play) 45%, var(--rule)); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); background-image: radial-gradient(circle at 100% 0, var(--play-soft), transparent 55%); }
.qcard { display: grid; gap: 12px; animation: prx-in .3s ease; }
.qnum { margin: 0; font: 600 12px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--play); }
.qnum span { color: var(--muted); }
.setup { margin: 0; font-size: 1.05rem; max-width: 66ch; }
.question { margin: 0; font: 700 1.15rem/1.35 var(--font-display); text-wrap: balance; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border: 1.5px solid var(--rule); border-radius: 10px; background: var(--paper); cursor: pointer; line-height: 1.4; transition: border-color .15s, background .15s, transform .15s; }
.opt:hover:not(:disabled) { border-color: var(--play); transform: translateX(2px); }
.opt .key { flex: none; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; font: 700 12px/1 var(--font-mono); color: var(--play); background: var(--play-soft); }
.opt:disabled { cursor: default; }
/* After a pick: the reviewer's read in the accent (not a "correct" green), the reader's different pick
   in the game's own colour (not red). The key is an agent's read of the diff, so a difference is a
   question, not a mistake. */
.opt.theirs { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--paper)); }
.opt.theirs .key { background: var(--accent); color: var(--paper); }
.opt.yours { border-color: var(--play); background: color-mix(in srgb, var(--play) 12%, var(--paper)); }
.opt.yours .key { background: var(--play); color: var(--paper); }
.opt .who { display: block; margin-top: 2px; font: 500 11px/1.3 var(--font-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.opt .who:empty { display: none; }
.opt.faded { opacity: .55; }
.reveal { padding: 12px 14px; border-radius: 10px; background: var(--play-soft); animation: prx-in .3s ease; }
.reveal p { margin: 0; }
.rtitle { font: 700 1rem/1.3 var(--font-display); margin-bottom: 4px !important; }
.rtitle.agree { color: var(--good); }
.rtitle.differ { color: var(--play); }
.qref { font-weight: 600; white-space: nowrap; }
.game-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.dots { display: flex; gap: 6px; }
.dot { width: 12px; height: 12px; padding: 0; border-radius: 50%; border: 2px solid var(--rule); background: transparent; cursor: pointer; }
.dot.cur { border-color: var(--play); }
.dot.agree { background: var(--good); border-color: var(--good); }
.dot.differ { background: var(--play); border-color: var(--play); }
.score { font: 600 13px/1 var(--font-mono); color: var(--play); }
.game-end { display: grid; gap: 8px; justify-items: start; animation: prx-in .3s ease; }
.game-end .big { margin: 0; font: 800 clamp(1.6rem, 1.2rem + 1.8vw, 2.2rem)/1.1 var(--font-display); }
.game-end .small { margin: 0; color: var(--muted); max-width: 60ch; }
@keyframes prx-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Components */
.components { border-top: 1px solid var(--rule); }
.component { border-bottom: 1px solid var(--rule); scroll-margin-top: 72px; }
.component summary { display: flex; align-items: baseline; gap: 12px; padding: 12px 4px; cursor: pointer; list-style: none; }
.component summary::-webkit-details-marker { display: none; }
.component summary::after { content: "+"; margin-left: 8px; font: 500 16px/1 var(--font-mono); color: var(--muted); }
.component[open] summary::after { content: "\2212"; }
.ctype { flex: none; width: 5.6em; font: 600 11px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; }
.ctype-added { color: var(--add); }
.ctype-removed { color: var(--del); }
.ctype-modified { color: var(--risk-med); }
.ctype-renamed { color: var(--muted); }
.cname { font-weight: 600; min-width: 0; }
.ccount { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cbody { padding: 0 4px 14px calc(5.6em * 11 / 16 + 16px); display: grid; gap: 8px; min-width: 0; }
.cbody p { margin: 0; max-width: 68ch; }
.files { list-style: none; padding: 0; display: grid; gap: 4px; }
.files li + li { margin-top: 0; }
.files .path { font-size: 13px; font-weight: 400; }
.reason { font: 12px var(--font-mono); color: var(--muted); }
.cpath .reason { margin-left: 8px; flex: none; } /* the map's row is a flex line: keep "deleted" off the name */
.cpath .before { display: inline-block; margin-left: 8px; flex: none; align-self: center; color: var(--accent); text-decoration: none; } /* "updated": changed since the reader's last visit, a link to that diff */
.cpath a.before:hover { text-decoration: underline; }
.crow.since { box-shadow: inset 3px 0 0 var(--accent); }
.since-line { margin: 0; padding: 8px 12px; border-radius: 8px; background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); font-size: 14px; }
.since-line.hint { background: none; box-shadow: none; padding: 0 2px; color: var(--muted); } /* what will appear after a push */
.since-line button { margin-left: 10px; font: 600 12px/1 var(--font-body); color: var(--accent); background: transparent; border: 1px solid var(--accent); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.since-line button:hover { background: var(--panel); }
@keyframes prx-flash { from { background: color-mix(in srgb, var(--changed) 22%, transparent); } to { background: transparent; } }
.flash { animation: prx-flash 1.6s ease-out; }

/* Intent: the author's claim is dashed (unverified), the independent read solid */
.verdict { margin: 0; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; font-size: 15px; }
.vicon { display: grid; place-items: center; flex: none; width: 24px; height: 24px; border-radius: 50%; font: 700 13px/1 var(--font-body); color: var(--paper); }
.verdict-yes { background: color-mix(in srgb, var(--good) 12%, transparent); } .verdict-yes .vicon { background: var(--good); }
.verdict-no { background: color-mix(in srgb, var(--bad) 12%, transparent); } .verdict-no .vicon { background: var(--bad); }
.verdict-unclear { background: color-mix(in srgb, var(--risk-med) 14%, transparent); } .verdict-unclear .vicon { background: var(--risk-med); }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 14px; overflow-wrap: anywhere; } /* long test names and paths wrap instead of widening a column */
.pair > * { min-width: 0; }
.claim, .independent { border-radius: 12px; padding: 16px 18px; }
.claim { border: 1.5px dashed color-mix(in srgb, var(--muted) 60%, transparent); }
.independent { border: 1px solid var(--rule); background: var(--panel); box-shadow: var(--shadow); }
.independent h4:first-of-type { margin-top: 4px; }
.tag { font: 600 11px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--rule); border-radius: 4px; padding: 3px 5px; vertical-align: 2px; margin-left: 4px; }
.goal { margin: 0; font: 600 1.08rem/1.45 var(--font-body); }
.approach { margin: 0; }
.steps { padding-left: 1.4em; }
.steps li::marker { font: 700 13px var(--font-display); color: var(--accent); }
.fold { margin-top: 10px; border-top: 1px solid var(--rule); padding-top: 10px; }
.fold summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px; }
.fold summary::-webkit-details-marker { display: none; }
.fold summary::before { content: "\25B8"; color: var(--muted); transition: transform .15s; }
.fold[open] summary::before { transform: rotate(90deg); }
.fold summary .n { font: 600 11px/1 var(--font-mono); color: var(--muted); background: var(--paper); border: 1px solid var(--rule); border-radius: 99px; padding: 3px 7px; }
.fold ul { margin-top: 8px; }
.none-line { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
.none-line span { font-weight: 600; color: var(--ink); }
.pair.plain > div { padding: 0; }
.tick { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; margin-right: 8px; font: 700 12px/1 var(--font-body); color: var(--paper); vertical-align: -3px; }
.tick.ok { background: var(--good); }
.tick.warn { background: var(--risk-med); }

.questions { list-style: none; padding: 0; display: grid; gap: 10px; max-width: 70ch; }
.questions li + li { margin-top: 0; }
.questions .check { align-items: flex-start; color: var(--ink); font-size: 16px; }
.questions .check input { margin-top: 2px; }
.questions .check input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }

.skipped summary { cursor: pointer; color: var(--muted); }
.skipped .files { margin-top: 10px; }
#low-risk ul:not(.files) { margin-bottom: 8px; }

.foot { display: flex; flex-wrap: wrap; gap: 4px 18px; padding-top: 18px; border-top: 1px solid var(--rule); font: 12px/1.5 var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }

/* A small celebration when every hotspot, scenario and question is done */
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 80; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 8px; height: 14px; border-radius: 2px; animation: prx-fall linear forwards; }
@keyframes prx-fall { to { transform: translateY(110vh) rotate(720deg); opacity: .2; } }

@media (prefers-reduced-motion: reduce) {
  .flash, .qcard, .reveal, .game-end { animation: none; }

    }
    var el = document.activeElement;
    if (el && (tourBox.contains(el) || stage.contains(el))) return !(el.closest && el.closest(".seg"));
    return !el || el === document.body || el === document.documentElement;
  }
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") { closeFull(); if (stage && stage.classList.contains("touring")) endTour(); }
    if ((ev.key === "ArrowRight" || ev.key === "ArrowLeft") && tourHasKeys(ev)) {
      ev.preventDefault();
      showStep(at + (ev.key === "ArrowRight" ? 1 : -1));
    }
  });

  // Progress through the review: hotspots looked at, scenarios answered, questions ticked.
  var checks = $$("input[data-track]"), cards = $$(".qcard"), wasDone = null;
  function progress() {
    var total = checks.length + cards.length;
    var done = checks.filter(function (c) { return c.checked; }).length + answeredHere();
    var box = $("#progress");
    if (!box || !total) return;
    box.hidden = false;
    // Done is everything looked at, answered and ticked, whatever the picks: the answer key is the
    // reviewer agent's, unchecked, so finishing the review is what gets celebrated, not agreeing.
    var complete = done >= total;
    box.classList.toggle("done", complete);
    $("#progress-label").textContent = complete ? "All done ✓" : done + " of " + total + " done";
    $("#progress-fill").style.width = Math.round(100 * Math.min(done, total) / total) + "%";
    if (complete && wasDone === false) celebrate();
    wasDone = complete;
  }
  checks.forEach(function (c) {
    var id = c.getAttribute("data-track");
    c.checked = !!saved.checks[id];
    var card = c.closest(".hotspot");
    if (card) card.classList.toggle("seen", c.checked);
    c.addEventListener("change", function () {
      if (c.checked) saved.checks[id] = 1; else delete saved.checks[id];
      if (card) card.classList.toggle("seen", c.checked);
      save("checks", [id]);
      if (c.checked) keepVisit();  // a tick is a sign of reading; an untick isn't
      progress();
    });
  });
  function celebrate() {
    if (reduceMotion) return;
    var box = document.createElement("div"), colors = ["#f08c00", "#6b3fd0", "#1a7f37", "#3249a8", "#e03131"];
    box.className = "confetti";
    for (var i = 0; i < 48; i++) {
      var p = document.createElement("i");
      p.style.left = (Math.random() * 100) + "vw";
      p.style.background = colors[i % colors.length];
      p.style.animationDuration = (1.4 + Math.random() * 1.4) + "s";
      p.style.animationDelay = (Math.random() * .4) + "s";
      box.appendChild(p);
    }
    document.body.appendChild(box);
    setTimeout(function () { box.remove(); }, 3400);
  }

  // Predict it: one scenario at a time. An answer is final until "Play again". The answer each
  // pick is compared with is the independent reviewer's read of the diff, and the page says so.
  var deck = $("#game-deck"), cur = 0;
  function pickOf(i) { return saved.quiz[cards[i].getAttribute("data-qid")]; }  // a pick is kept by scenario, not position
  function agrees(i) { return pickOf(i) === parseInt(cards[i].getAttribute("data-answer"), 10); }
  // The next scenario still to answer after i (the dots allow skipping ahead), or the score once none is left.
  function nextOpen(i) {
    for (var k = 1; k <= cards.length; k++) {
      var j = (i + k) % cards.length;
      if (pickOf(j) === undefined) return j;
    }
    return cards.length;
  }
  function score() {
    var answered = answeredHere(), good = 0;
    for (var i = 0; i < cards.length; i++) if (pickOf(i) !== undefined && agrees(i)) good++;
    $("#game-score").textContent = answered ? good + " of " + answered + " match the reviewer" : "";
    return good;
  }
  function paint(i) {
    var card = cards[i], pick = pickOf(i), answer = parseInt(card.getAttribute("data-answer"), 10);
    var answered = pick !== undefined, reveal = $(".reveal", card), title = $(".rtitle", card);
    $$(".opt", card).forEach(function (b, j) {
      b.disabled = answered;
      b.classList.toggle("theirs", answered && j === answer);
      b.classList.toggle("yours", answered && j === pick && pick !== answer);
      b.classList.toggle("faded", answered && j !== answer && j !== pick);
      $(".who", b).textContent = !answered ? "" : j === answer && j === pick ? "Your pick · the reviewer’s read"
        : j === answer ? "The reviewer’s read" : j === pick ? "Your pick" : "";
    });
    reveal.hidden = !answered;
    if (answered) {
      title.className = "rtitle " + (pick === answer ? "agree" : "differ");
      title.textContent = pick === answer ? "Same as the reviewer’s read."
        : "The reviewer reads it as " + "ABCD".charAt(answer) + ".";
    }
  }
  function show(i) {
    cur = i;
    var end = $(".game-end", deck), next = $("#game-next");
    cards.forEach(function (c, j) { c.hidden = j !== i; });
    end.hidden = i < cards.length;
    if (i >= cards.length) {
      var good = score();
      $("#game-result").textContent = good + " of " + cards.length + " match the reviewer";
      $("#game-note").textContent = good === cards.length ? "You read this change the way the independent reviewer did."
        : good * 2 >= cards.length ? "Mostly the same read. Where you differ, the linked code decides: one of you misread it, and either is worth knowing before approving."
        : "You and the reviewer read this change differently. Check the linked code before approving, and comment on the PR where the reviewer got it wrong.";
    } else {
      paint(i);
    }
    next.hidden = i >= cards.length || pickOf(i) === undefined;
    next.textContent = nextOpen(i) >= cards.length ? "See your score →" : "Next scenario →";
    $$(".dot", deck).forEach(function (d, j) {
      d.classList.toggle("cur", j === i);
      d.classList.toggle("agree", pickOf(j) !== undefined && agrees(j));
      d.classList.toggle("differ", pickOf(j) !== undefined && !agrees(j));
    });
  }
  if (deck && cards.length) {
    cards.forEach(function (card, i) {
      $$(".opt", card).forEach(function (b) {
        b.addEventListener("click", function () {
          if (pickOf(i) !== undefined) return;
          saved.quiz[card.getAttribute("data-qid")] = parseInt(b.getAttribute("data-i"), 10);
          save("quiz", [card.getAttribute("data-qid")]);
          show(i);
          score();
          progress();
          // A live region that was hidden until now isn't reliably read out, so the verdict goes to one always there.
          $("#game-live").textContent = $(".rtitle", card).textContent + " " + $(".explain", card).textContent;
          $("#game-next").focus();
        });
      });
    });
    $$(".dot", deck).forEach(function (d) { d.addEventListener("click", function () { show(parseInt(d.getAttribute("data-i"), 10)); }); });
    $("#game-next").addEventListener("click", function () { show(nextOpen(cur)); });
    $("#game-again").addEventListener("click", function () {
      saved.quiz = {};
      wasDone = false;
      $("#game-live").textContent = "";
      save("quiz", mineIds.quiz);
      score();
      progress();
      show(0);
    });
    var first = 0;
    while (first < cards.length && pickOf(first) !== undefined) first++;
    show(first);
    score();
  }

  // Section links scroll in place (no history entries inside the frame) and follow the reader.
  var links = $$(".jump-links a");
  $$("a[data-jump]").forEach(function (a) {
    a.addEventListener("click", function (ev) { ev.preventDefault(); goTo(a.getAttribute("data-jump")); });
  });
  $$(".cmap a.hb").forEach(function (a) {
    a.addEventListener("click", function (ev) { ev.preventDefault(); goTo(a.getAttribute("href").slice(1)); });
  });
  // The current section is the one the nav last went to, until the reader scrolls themselves; then
  // the last one whose top has passed 30% of the view (the first at the top, the last at the very
  // bottom). Measured on scroll rather than with IntersectionObserver, whose rootMargin browsers
  // ignore in a cross-origin frame, which is where claude.ai shows this page.
  var queued = false, arrived = false;
  function follow() {
    queued = false;
    var line = innerHeight * 0.3, current = links[0];
    var bottom = innerHeight + scrollY >= document.documentElement.scrollHeight - 2;
    var pinned = links.filter(function (a) { return a.getAttribute("data-jump") === jumped; })[0];  // not a hotspot or part
    if (pinned) {
      // Released once the section, having come into view, leaves it: however the reader scrolled
      // (a dragged scrollbar sends no wheel or key event).
      var r = document.getElementById(jumped).getBoundingClientRect(), seen = r.bottom > 0 && r.top < innerHeight;
      if (seen) arrived = true;
      else if (arrived) { jumped = null; pinned = null; }
    }
    links.forEach(function (a) {
      var s = document.getElementById(a.getAttribute("data-jump"));
      if (pinned ? a === pinned : s && (s.getBoundingClientRect().top <= line || bottom)) current = a;
    });
    links.forEach(function (a) { a.classList.toggle("on", a === current); });
  }
  if (links.length) {
    window.addEventListener("scroll", function () { if (!queued) { queued = true; requestAnimationFrame(follow); } }, { passive: true });
    ["wheel", "touchmove", "keydown"].forEach(function (type) {
      window.addEventListener(type, function () { if (jumped) { jumped = null; follow(); } }, { passive: true });
    });
    window.addEventListener("resize", follow);
    follow();
  }
  progress();
})();
</script>
